[package]
name = "gitenv"
version = "0.1.0"
edition = "2024"

[lib]
name = "gitenv"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
globset = "0.4"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
